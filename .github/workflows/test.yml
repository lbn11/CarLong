name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ci-heavy 标签的整体页面 widget 测试在 musl aarch64 上会因
    # flutter_tester 线程栈浅而 StackOverflow，故全量测试放 glibc CI 跑。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
