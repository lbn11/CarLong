name: merge_fleet
description: "车水马龙（Merge Fleet）—— 合成车辆、一路升级到火箭与彗星的交通主题合并游戏。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  # 官方本地化：gen-l10n 生成的 AppLocalizations 依赖它的 delegates。
  # SDK 自带、无需联网下载。当前只有 en / zh 两套，见 lib/l10n/。
  flutter_localizations:
    sdk: flutter
  flame: ^1.38.0
  flame_audio: ^2.1.1
  shared_preferences: ^2.5.5
  # ── 海外发行（App Store / Google Play）的广告与归因 ──────────────────
  # google_mobile_ads = AdMob 官方 Flutter 插件（激励视频）。
  # 只声明了 android/ios 两个平台，Web/桌面构建由
  # lib/services/ads/admob/admob_ad_provider.dart 的条件导入隔离，
  # 不会把 SDK 拖进 web 预览包。
  google_mobile_ads: ^5.1.0
  # iOS 14.5+ 的 ATT 授权弹窗。没有它 IDFA 全零，个性化广告失效、
  # eCPM 掉一半，属于海外发行的必选项。
  app_tracking_transparency: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  # 让 flutter gen-l10n 从 lib/l10n/*.arb 生成 AppLocalizations。
  # 生成物就在 lib/l10n/ 下并入库：不入库的话 clone 完 analyze 会直接红线
  # （.dart_tool 方案要求每个环境先跑一次 gen-l10n，单人项目没必要）。
  generate: true
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/vehicles/

  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
    # Emoji 子集：只保留 lib/ 里实际用到的 130 个字符（199KB）。
    # 不加这个，Web(CanvasKit) 上所有 emoji 都是豆腐块——玩家看到的就是
    # "车里没有车"、"按钮上全是方框"。移动端系统自带 emoji 也能兜住，
    # 显式声明只是为了跨端一致。
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf

# Launcher icon — generated by `flutter pub run flutter_launcher_icons`.
# Source: assets/icon/icon.png (full opaque), with a chroma-keyed
# transparent variant (icon_foreground.png) for Android adaptive icon.
# The hex below matches the coral background detected by tool/make_icon.py.
flutter_launcher_icons:
  android: "launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#F76051"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  # Apple App Store rejects icons with an alpha channel.
  remove_alpha_ios: true
