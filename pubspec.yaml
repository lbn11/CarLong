name: merge_fleet
description: "车水马龙（Merge Fleet）—— 合成车辆、一路升级到火箭与彗星的交通主题合并游戏。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.0
  flame_audio: ^2.1.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/vehicles/

  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf

# Launcher icon — generated by `flutter pub run flutter_launcher_icons`.
# Source: assets/icon/icon.png (full opaque), with a chroma-keyed
# transparent variant (icon_foreground.png) for Android adaptive icon.
# The hex below matches the coral background detected by tool/make_icon.py.
flutter_launcher_icons:
  android: "launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#F76051"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  # Apple App Store rejects icons with an alpha channel.
  remove_alpha_ios: true
